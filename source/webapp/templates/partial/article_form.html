<form method="post">
    {% csrf_token %}

    {% for error in form.non_field_errors %}
        <p class="fg-danger">{{ error }}</p>
    {% endfor %}

    {% for field in form %}
        <div class="form-field mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {% for error in field.errors %}
                <p class="fg-danger">{{ error }}</p>
            {% endfor %}
            {{ field }}
        </div>
    {% endfor %}

    <button type="submit" class="btn-solid theme-accent">{{ button_value }}</button>
</form>
