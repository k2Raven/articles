{% extends 'base.html' %}

{% block content %}
    <h1>Articles</h1>

    <div class="row row-cols-3">

        {% for article in articles %}
            <div class="col mb-4">
                <div class="card">
                    <div class="card-header">
                        Author: {{ article.author }}
                    </div>
                    <div class="card-body">
                        <h4 class="card-title">{{ article.title }}</h4>
                        <a href="{% url 'article_view' article.pk %}" class="btn-solid theme-primary">Подробнее</a>
                    </div>
                </div>

            </div>
        {% endfor %}
    </div>

{% endblock %}
