{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<h1>Articles</h1>

{% for article in articles %}
    <div>

        <h1>{{ article.title }} (id: {{ article.id }})</h1>
        <p>Author: {{ article.author }}</p>
        <p><a href="article/?id={{ article.id }}">Подробнее</a></p>
        <p><a href="article/delete/?id={{ article.id }}">Удалить статью</a></p>

    </div>
{% endfor %}

<p>
    <a href="articles/add/">create article</a>
</p>
</body>
</html>
